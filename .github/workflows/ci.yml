name: CI

# Runs the unit-test suite on pull requests targeting main and on pushes to main. A PR branch used to
# run twice per push (once for the push, once for the pull_request merge ref - different refs, so the
# concurrency group did not dedupe them); the pull_request run is the one that matters, because it
# tests the merge with main. Forks' locale/contributor PRs are covered by the same trigger.
# Mirrors the test step in release.yml so a green CI here means the tag build's tests will pass too
# (release.yml runs the same tests, serially, in one step; this workflow runs the main lane in parallel).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run for the same ref when new commits are pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The main lane: everything except the native-desktop tests, in parallel (pytest-xdist `-n auto`, one
  # worker per runner core). The order-dependent access violation that kept it serial (a module
  # fixture destroying the QApplication) was fixed by #514; the order-dependent module state found
  # while switching (the layout slot's "probing" gen, font_release's shut_down flag, a test file's
  # fake date, a modal sheet left open) is reset per test in tests/unit/conftest.py and the files
  # themselves. Registry names
  # are unique per test. release.yml's test step stays SERIAL on purpose: the tag build is the one
  # run that must not depend on xdist's scheduling, and it gives a second, different order.
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          pip install -r requirements.txt
          pip install -r dev-requirements.txt

      - name: Run unit tests (all but native_desktop, parallel)
        env:
          # Run the PyQt6 GUI tests headless + deterministically (conftest.py also sets this via
          # setdefault; this makes the CI environment explicit).
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1"
        run: |
          .\.venv\Scripts\Activate.ps1
          python -m pytest -v -n auto -m "not native_desktop" --durations=25

  # The native lane: tests that show real windows on the runner's desktop or read its foreground /
  # hit-test state (their child processes run on Qt's "windows" platform). One at a time, so no test's
  # window can move another's foreground; a separate job so it runs alongside the main lane.
  native:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          pip install -r requirements.txt
          pip install -r dev-requirements.txt

      - name: Run native-desktop tests (serial)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1"
        run: |
          .\.venv\Scripts\Activate.ps1
          python -m pytest -v -n 0 -m native_desktop --durations=10
