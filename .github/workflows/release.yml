name: Create Release and Sign Artifacts

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Install dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          pip install -r requirements.txt
          pip install -r dev-requirements.txt

      - name: Run unit tests
        env:
          # GUI tests run headless + deterministic (conftest.py also sets this, but
          # the tag build that gates a public release should be explicit).
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1"
        run: |
          .\.venv\Scripts\Activate.ps1
          python -m pytest



      - name: Build the application
        run: .\build\build.bat

      - name: Upload Unsigned Installer
        id: upload_installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-unsigned
          path: dist/NetSpeedTray-*/NetSpeedTray-*-Setup.exe

      - name: Upload Unsigned Portable Zip
        id: upload_portable
        uses: actions/upload-artifact@v7
        with:
          name: portable-unsigned
          path: dist/NetSpeedTray-*/NetSpeedTray-Portable-*.zip

      - name: Submit Installer to SignPath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: "netspeedtray"
          artifact-configuration-slug: "netspeedtray-installer"
          signing-policy-slug: "release-signing"
          github-artifact-id: ${{ steps.upload_installer.outputs.artifact-id }}
          output-artifact-directory: "signed-installer"

      - name: Submit Portable ZIP to SignPath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: "netspeedtray"
          artifact-configuration-slug: "netspeedtray-portable"
          signing-policy-slug: "release-signing"
          github-artifact-id: ${{ steps.upload_portable.outputs.artifact-id }}
          output-artifact-directory: "signed-portable"

      # --- Calculate Checksums of SIGNED files ---
      - name: Generate Checksums
        run: |
          echo "Calculating SHA256 checksums..."
          $files = Get-ChildItem -Path signed-installer, signed-portable -Recurse -Include *.exe, *.zip
          
          # Create/Clear the file
          $null > checksums.txt
          
          foreach ($file in $files) {
            $hash = Get-FileHash $file.FullName -Algorithm SHA256
            $entry = "$($hash.Hash) $($file.Name)"
            echo $entry
            echo $entry >> checksums.txt
          }
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            signed-installer/**/*
            signed-portable/**/*
            checksums.txt
          # A tag with a '-' is a prerelease (v2.2.0-beta.1). Without these two flags the
          # action defaults prerelease to false and the API defaults make_latest to true,
          # so a beta would become /releases/latest - the endpoint the in-app updater polls.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  submit-to-winget:
    needs: build-and-sign
    # Never submit a prerelease to WinGet - this guard is independent of the
    # prerelease flag above; without it every tag lands in microsoft/winget-pkgs.
    if: "!contains(github.ref_name, '-')"
    runs-on: ubuntu-latest
    steps:
      - name: Sync WinGet Fork
        continue-on-error: true
        run: gh repo sync erez-c137/winget-pkgs --source microsoft/winget-pkgs
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
      - name: Submit to Winget
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          # Your Winget Package ID
          identifier: erez-c137.NetSpeedTray
          
          # Only submit the Installer (Setup.exe), ignore the Portable Zip
          installers-regex: '.*Setup.exe$'
          
          # The token you just created
          token: ${{ secrets.WINGET_TOKEN }}

  submit-to-msstore:
    needs: build-and-sign
    # Same guard as WinGet: a prerelease must never reach the Store listing. The listing is a
    # Win32 EXE submission (Store ID XP9MHWQZJPLQM8), so the Store downloads and caches the
    # Setup.exe from the GitHub release asset URL below, then runs its own certification pass.
    # Nothing here is MSIX - the taskbar dock and the in-app updater behave exactly as on GitHub.
    if: "!contains(github.ref_name, '-')"
    runs-on: ubuntu-latest
    # Partner Center is a best-effort channel: a Store hiccup must not fail the release.
    continue-on-error: true
    steps:
      - name: Check Store credentials
        id: creds
        env:
          CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "::warning::MSSTORE_* secrets are not set - Store submission skipped. Submit ${GITHUB_REF_NAME} by hand in Partner Center."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Store credentials
        if: steps.creds.outputs.ok == 'true'
        uses: microsoft/store-submission@v1
        with:
          command: configure
          type: win32
          seller-id: ${{ secrets.MSSTORE_SELLER_ID }}
          product-id: ${{ secrets.MSSTORE_PRODUCT_ID }}
          tenant-id: ${{ secrets.MSSTORE_TENANT_ID }}
          client-id: ${{ secrets.MSSTORE_CLIENT_ID }}
          client-secret: ${{ secrets.MSSTORE_CLIENT_SECRET }}

      - name: Point the listing at this release's installer
        if: steps.creds.outputs.ok == 'true'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          V="${VERSION#v}"
          URL="https://github.com/erez-c137/NetSpeedTray/releases/download/${VERSION}/NetSpeedTray-${V}-x64-Setup.exe"
          # This PUT replaces the listing's package module, so every field below mirrors what the
          # by-hand 2.1.4 submission holds - read back verbatim by the Store preflight workflow on
          # 2026-09-04 - except packageUrl, which moves from the one-off upload to the GitHub
          # release asset. Change a field here only after re-reading the module with the preflight.
          python3 - "$URL" > product-update.json <<'PY'
          import json, sys
          scenarios = ["installationCancelledByUser", "applicationAlreadyExists",
                       "installationAlreadyInProgress", "diskSpaceIsFull", "rebootRequired",
                       "networkFailure", "packageRejectedDuringInstallation",
                       "installationSuccessful", "miscellaneous"]
          print(json.dumps({"packages": [{
              "packageUrl": sys.argv[1],
              "languages": ["zh", "zh-tw", "nl", "en", "fr", "de", "he", "ja", "ko", "pl", "ru", "sl", "tr", "es", "it"],
              "architectures": ["X64"],
              "isSilentInstall": False,
              "installerParameters": "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-",
              "genericDocUrl": "https://github.com/erez-c137/NetSpeedTray",
              "errorDetails": [{"errorScenario": s, "errorScenarioDetails": []} for s in scenarios],
              "packageType": "exe",
          }]}, separators=(",", ":")))
          PY
          echo "PRODUCT_UPDATE=$(cat product-update.json)" >> "$GITHUB_ENV"
          echo "Store package URL: $URL"
          python3 -c "import json;p=json.load(open('product-update.json'))['packages'][0];p.pop('errorDetails');print(json.dumps(p,indent=2))"

      - name: Update draft submission
        if: steps.creds.outputs.ok == 'true'
        uses: microsoft/store-submission@v1
        with:
          command: update
          product-update: ${{ env.PRODUCT_UPDATE }}

      - name: Publish submission
        if: steps.creds.outputs.ok == 'true'
        uses: microsoft/store-submission@v1
        with:
          command: publish
