name: Create Release and Sign Artifacts

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # First, before anything is built or sent for signing: the tag must name the version the code
      # carries. The build, the asset names, the in-app updater and WinGet all read __version__, so a
      # tag on the wrong commit (it has happened: a chained tag landed on the wrong one) would publish
      # a release whose files say another version. Prerelease tags compare the same way
      # (v2.2.0-rc.1 <-> "2.2.0-rc.1").
      - name: Check the tag matches __version__
        shell: pwsh
        run: |
          $init = Get-Content -Raw -Path src/netspeedtray/__init__.py
          $m = [regex]::Match($init, '(?m)^__version__\s*=\s*"([^"]+)"')
          if (-not $m.Success) { Write-Error "No __version__ in src/netspeedtray/__init__.py"; exit 1 }
          $expected = "v" + $m.Groups[1].Value
          if ($env:GITHUB_REF_NAME -cne $expected) {
            Write-Error "Tag '$($env:GITHUB_REF_NAME)' does not match __version__ (expected '$expected'). Re-tag the right commit."
            exit 1
          }
          Write-Host "Tag $($env:GITHUB_REF_NAME) matches __version__."

      # The release body. The release goes public (and, for a final, Latest - what every installed
      # copy's update dialog shows) the moment "Create Release" runs, so notes applied by hand
      # afterwards leave a window with an empty body. A tracked release-notes/<tag>.md is published
      # WITH the release instead (see release-notes/README.md). HTML comments (draft notes to self)
      # are stripped: the update dialog shows the body as plain text. No file = the old behaviour,
      # an empty body to fill with `gh release edit --notes-file` - resolved here, before the build,
      # so a missing file is visible on the Summary page while there is still time to add it.
      - name: Resolve the release notes
        id: notes
        shell: pwsh
        run: |
          $src = "release-notes/$($env:GITHUB_REF_NAME).md"
          if (Test-Path $src) {
            $text = Get-Content -Raw -Encoding utf8 $src
            # Every '<!-- ... -->', and an UNCLOSED '<!--' through to the end: GitHub would hide the
            # rest of the page, the plain-text update dialog would show the draft note verbatim.
            $text = [regex]::Replace($text, '(?s)<!--.*?(-->|\z)', '').Trim()
            if (-not $text) { Write-Error "$src is empty once comments are removed"; exit 1 }
            $out = Join-Path $env:RUNNER_TEMP "release-body.md"
            Set-Content -Path $out -Value $text -Encoding utf8
            "path=$out" >> $env:GITHUB_OUTPUT
            Write-Host "Release notes: $src"
          } else {
            "path=" >> $env:GITHUB_OUTPUT
            $msg = "No $src - the release will publish with an EMPTY body; apply notes with gh release edit right after."
            Write-Host "::warning::$msg"
            "> [!WARNING]`n> $msg" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Pinned: a new Inno Setup could change the compiled Setup under a release with nothing in
      # this repo changing. setup.iss's [Code] also declares Win32 pointers as Longword, which is
      # right only while Setup is a 32-bit process (Inno Setup 6). Bump deliberately, after an
      # ISCC compile and an install test.
      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Install dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          pip install -r requirements.txt
          pip install -r dev-requirements.txt

      - name: Run unit tests
        env:
          # GUI tests run headless + deterministic (conftest.py also sets this, but
          # the tag build that gates a public release should be explicit).
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1"
        run: |
          .\.venv\Scripts\Activate.ps1
          python -m pytest



      # Deep signing: the exe the installer puts in Program Files must be signed too, not only
      # Setup.exe and the portable zip (Smart App Control blocks an unsigned exe, #333). SignPath
      # cannot sign inside an Inno installer, but the portable zip carries exactly the
      # dist\NetSpeedTray bytes the installer packs (portable.marker is its only extra). So: sign the
      # portable first, copy its signed NetSpeedTray.exe into dist\NetSpeedTray, THEN compile and
      # sign the installer. Two approvals, one after the other - SignPath Foundation needs a manual
      # approval per request (signpath.org/terms), and the second request cannot exist before the
      # first is signed. Each wait polls at a fixed 20 s (build/ci/wait-signpath.ps1) and puts its
      # approval link on the run's Summary page.
      - name: Build the exe and the portable zip (the installer is compiled after signing)
        env:
          NST_SKIP_INSTALLER: "1"
        run: .\build\build.bat

      - name: Upload Unsigned Portable Zip
        id: upload_portable
        uses: actions/upload-artifact@v7
        with:
          name: portable-unsigned
          path: dist/NetSpeedTray-*/NetSpeedTray-Portable-*.zip

      - name: Submit Portable ZIP to SignPath (approval 1 of 2)
        id: sign_portable
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: "netspeedtray"
          artifact-configuration-slug: "netspeedtray-portable"
          signing-policy-slug: "release-signing"
          github-artifact-id: ${{ steps.upload_portable.outputs.artifact-id }}
          wait-for-completion: false

      - name: Wait for the portable approval, then download it
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          REQUEST_ID: ${{ steps.sign_portable.outputs.signing-request-id }}
          REQUEST_URL: ${{ steps.sign_portable.outputs.signing-request-web-url }}
        shell: pwsh
        run: ./build/ci/wait-signpath.ps1 -RequestId $env:REQUEST_ID -WebUrl $env:REQUEST_URL -Label "Portable (approval 1 of 2)" -OutDir signed-portable -TimeoutMinutes 30

      - name: Put the signed exe into the installer payload
        shell: pwsh
        run: ./build/ci/use-signed-exe.ps1 -SignedPortableDir signed-portable

      - name: Compile the installer from the signed exe
        shell: pwsh
        run: ./build/ci/compile-installer.ps1

      - name: Upload Unsigned Installer
        id: upload_installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-unsigned
          path: dist/NetSpeedTray-*/NetSpeedTray-*-Setup.exe

      - name: Submit Installer to SignPath (approval 2 of 2)
        id: sign_installer
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: "netspeedtray"
          artifact-configuration-slug: "netspeedtray-installer"
          signing-policy-slug: "release-signing"
          github-artifact-id: ${{ steps.upload_installer.outputs.artifact-id }}
          wait-for-completion: false

      - name: Wait for the installer approval, then download it
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          REQUEST_ID: ${{ steps.sign_installer.outputs.signing-request-id }}
          REQUEST_URL: ${{ steps.sign_installer.outputs.signing-request-web-url }}
        shell: pwsh
        run: ./build/ci/wait-signpath.ps1 -RequestId $env:REQUEST_ID -WebUrl $env:REQUEST_URL -Label "Installer (approval 2 of 2)" -OutDir signed-installer -TimeoutMinutes 30

      # The point of all of the above: install the signed Setup.exe exactly as a user would
      # (silently, as WinGet and the Store do) and refuse to publish unless the exe that lands in
      # Program Files has a Valid signature. The runner is throwaway; the script uninstalls anyway.
      - name: Verify the installed exe is signed
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem signed-installer -Recurse -Filter "NetSpeedTray-*-Setup.exe")
          if ($setup.Count -ne 1) { throw "Expected one signed Setup.exe, found $($setup.Count)" }
          ./build/ci/verify-installed-exe.ps1 -Setup $setup[0].FullName

      # --- Calculate Checksums of SIGNED files ---
      - name: Generate Checksums
        run: |
          echo "Calculating SHA256 checksums..."
          $files = Get-ChildItem -Path signed-installer, signed-portable -Recurse -Include *.exe, *.zip
          
          # Create/Clear the file
          $null > checksums.txt
          
          foreach ($file in $files) {
            $hash = Get-FileHash $file.FullName -Algorithm SHA256
            $entry = "$($hash.Hash) $($file.Name)"
            echo $entry
            echo $entry >> checksums.txt
          }
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            signed-installer/**/*
            signed-portable/**/*
            checksums.txt
          # Empty when there is no release-notes/<tag>.md: the body is then left empty, as before.
          body_path: ${{ steps.notes.outputs.path }}
          # A tag with a '-' is a prerelease (v2.2.0-beta.1). Without these two flags the
          # action defaults prerelease to false and the API defaults make_latest to true,
          # so a beta would become /releases/latest - the endpoint the in-app updater polls.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  submit-to-winget:
    needs: build-and-sign
    # Never submit a prerelease to WinGet - this guard is independent of the
    # prerelease flag above; without it every tag lands in microsoft/winget-pkgs.
    if: "!contains(github.ref_name, '-')"
    runs-on: ubuntu-latest
    steps:
      - name: Sync WinGet Fork
        continue-on-error: true
        run: gh repo sync erez-c137/winget-pkgs --source microsoft/winget-pkgs
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
      - name: Submit to Winget
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          # Your Winget Package ID
          identifier: erez-c137.NetSpeedTray
          
          # Only submit the Installer (Setup.exe), ignore the Portable Zip
          installers-regex: '.*Setup.exe$'
          
          # The token you just created
          token: ${{ secrets.WINGET_TOKEN }}

  submit-to-msstore:
    needs: build-and-sign
    # Same guard as WinGet: a prerelease must never reach the Store listing. The implementation
    # lives in store-submit.yml (one payload, also runnable by hand for a repair) and carries its
    # own continue-on-error, so a Partner Center hiccup never fails the release run.
    if: "!contains(github.ref_name, '-')"
    uses: ./.github/workflows/store-submit.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
