name: Create Release and Sign Artifacts

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Install dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          pip install -r requirements.txt
          pip install -r dev-requirements.txt

      - name: Run unit tests
        env:
          # GUI tests run headless + deterministic (conftest.py also sets this, but
          # the tag build that gates a public release should be explicit).
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1"
        run: |
          .\.venv\Scripts\Activate.ps1
          python -m pytest



      - name: Build the application
        run: .\build\build.bat

      - name: Upload Unsigned Installer
        id: upload_installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-unsigned
          path: dist/NetSpeedTray-*/NetSpeedTray-*-Setup.exe

      - name: Upload Unsigned Portable Zip
        id: upload_portable
        uses: actions/upload-artifact@v7
        with:
          name: portable-unsigned
          path: dist/NetSpeedTray-*/NetSpeedTray-Portable-*.zip

      # Both signing requests are submitted WITHOUT waiting, so both approval prompts reach the
      # owner at once. SignPath Foundation requires a manual approval per release (signpath.org/terms);
      # submitted one after the other, the portable's prompt only appeared once the installer's was
      # approved (2.1.5: ~21 min + ~10 min). The wait below also polls at a fixed 20 s - the action's
      # own wait backs off to ~20 min between polls, so a late approval sat unnoticed (2.1.6 timed out).
      - name: Submit Installer to SignPath
        id: sign_installer
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: "netspeedtray"
          artifact-configuration-slug: "netspeedtray-installer"
          signing-policy-slug: "release-signing"
          github-artifact-id: ${{ steps.upload_installer.outputs.artifact-id }}
          wait-for-completion: false

      - name: Submit Portable ZIP to SignPath
        id: sign_portable
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: "netspeedtray"
          artifact-configuration-slug: "netspeedtray-portable"
          signing-policy-slug: "release-signing"
          github-artifact-id: ${{ steps.upload_portable.outputs.artifact-id }}
          wait-for-completion: false

      - name: Wait for both approvals, then download the signed artifacts
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          INSTALLER_ID: ${{ steps.sign_installer.outputs.signing-request-id }}
          PORTABLE_ID: ${{ steps.sign_portable.outputs.signing-request-id }}
          INSTALLER_URL: ${{ steps.sign_installer.outputs.signing-request-web-url }}
          PORTABLE_URL: ${{ steps.sign_portable.outputs.signing-request-web-url }}
        shell: pwsh
        run: |
          # Links on the run page, so approving is one click from the Actions tab.
          "## Signing requests - approve both`n`n- Installer: $env:INSTALLER_URL`n- Portable: $env:PORTABLE_URL" >> $env:GITHUB_STEP_SUMMARY
          $api = "https://app.signpath.io/Api/v1/$env:SIGNPATH_ORG/SigningRequests"
          $headers = @{ Authorization = "Bearer $env:SIGNPATH_API_TOKEN" }
          $pending = [ordered]@{ "signed-installer" = $env:INSTALLER_ID; "signed-portable" = $env:PORTABLE_ID }
          $deadline = (Get-Date).AddMinutes(45)
          while ($pending.Count -gt 0) {
            foreach ($dir in @($pending.Keys)) {
              $id = $pending[$dir]
              try { $st = Invoke-RestMethod -Uri "$api/$id/Status" -Headers $headers }
              catch { Write-Host "$dir : status call failed ($($_.Exception.Message)), retrying"; continue }
              if (-not $st.isFinalStatus) { Write-Host "$dir : $($st.status)"; continue }
              if ($st.status -ne "Completed") { throw "$dir signing request $id ended as $($st.status)" }
              $zip = "$dir.zip"
              Invoke-WebRequest -Uri "$api/$id/SignedArtifact" -Headers $headers -OutFile $zip
              Expand-Archive -Path $zip -DestinationPath $dir -Force
              Remove-Item $zip
              Write-Host "$dir : signed and downloaded"
              $pending.Remove($dir)
            }
            if ($pending.Count -eq 0) { break }
            if ((Get-Date) -gt $deadline) { throw "Timed out after 45 min waiting for: $($pending.Keys -join ', ')" }
            Start-Sleep -Seconds 20
          }
          Get-ChildItem signed-installer, signed-portable -Recurse -File | ForEach-Object { Write-Host $_.FullName }

      # --- Calculate Checksums of SIGNED files ---
      - name: Generate Checksums
        run: |
          echo "Calculating SHA256 checksums..."
          $files = Get-ChildItem -Path signed-installer, signed-portable -Recurse -Include *.exe, *.zip
          
          # Create/Clear the file
          $null > checksums.txt
          
          foreach ($file in $files) {
            $hash = Get-FileHash $file.FullName -Algorithm SHA256
            $entry = "$($hash.Hash) $($file.Name)"
            echo $entry
            echo $entry >> checksums.txt
          }
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            signed-installer/**/*
            signed-portable/**/*
            checksums.txt
          # A tag with a '-' is a prerelease (v2.2.0-beta.1). Without these two flags the
          # action defaults prerelease to false and the API defaults make_latest to true,
          # so a beta would become /releases/latest - the endpoint the in-app updater polls.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  submit-to-winget:
    needs: build-and-sign
    # Never submit a prerelease to WinGet - this guard is independent of the
    # prerelease flag above; without it every tag lands in microsoft/winget-pkgs.
    if: "!contains(github.ref_name, '-')"
    runs-on: ubuntu-latest
    steps:
      - name: Sync WinGet Fork
        continue-on-error: true
        run: gh repo sync erez-c137/winget-pkgs --source microsoft/winget-pkgs
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
      - name: Submit to Winget
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          # Your Winget Package ID
          identifier: erez-c137.NetSpeedTray
          
          # Only submit the Installer (Setup.exe), ignore the Portable Zip
          installers-regex: '.*Setup.exe$'
          
          # The token you just created
          token: ${{ secrets.WINGET_TOKEN }}

  submit-to-msstore:
    needs: build-and-sign
    # Same guard as WinGet: a prerelease must never reach the Store listing. The implementation
    # lives in store-submit.yml (one payload, also runnable by hand for a repair) and carries its
    # own continue-on-error, so a Partner Center hiccup never fails the release run.
    if: "!contains(github.ref_name, '-')"
    uses: ./.github/workflows/store-submit.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
