[pytest]
# A bare `python -m pytest` from the repo root collects ONLY the real suite (never a stray harness or
# conftest elsewhere in the checkout, e.g. a local scripts/ folder).
testpaths = src/netspeedtray/tests
addopts = --strict-markers

# Lanes (CI runs the main and native lanes as two jobs, serially, .github/workflows/ci.yml):
#   everything:                 python -m pytest
#   main lane only:             python -m pytest -m "not native_desktop"
#   native lane only:           python -m pytest -m native_desktop
#   quick inner loop:           python -m pytest -m "not slow and not native_desktop"
# Parallel (pytest-xdist, dev-requirements.txt): add `-n auto`. tests/conftest.py then keeps every
# native_desktop test on ONE worker, one at a time (--dist loadgroup). Not the default yet: in other
# test orders the suite can hit an access violation that already exists on main (see the Phase A PR).
markers =
    native_desktop: shows real native windows or reads desktop state (foreground, hit tests) - run one at a time, never next to each other
    slow: slow by design (real child processes killed and relaunched); still part of every full run
