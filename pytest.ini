[pytest]
# A bare `python -m pytest` from the repo root collects ONLY the real suite (never a stray harness or
# conftest elsewhere in the checkout, e.g. a local scripts/ folder).
testpaths = src/netspeedtray/tests
addopts = --strict-markers
# Keep tmp_path folders only for failed tests (pytest's default keeps every test's folder from the
# last 3 sessions; a full run writes ~1 GB of test databases, and parallel runs filled C: on 2026-11-11).
tmp_path_retention_policy = failed
# Backstop (pytest-timeout, dev-requirements.txt): a test that hangs or spins fails after this long
# instead of running all night (2026-11-16: a test spinning against a regression grew to ~28 GB and
# starved the PC). Generous on purpose - the slowest real test is about a minute. The thread method
# is the only one on Windows (no SIGALRM): it dumps every thread's stack and ends the run.
timeout = 300
timeout_method = thread

# Lanes (CI runs the main lane with -n auto and the native lane serially, as two jobs,
# .github/workflows/ci.yml; release.yml runs everything serially):
#   everything:                 python -m pytest
#   main lane only:             python -m pytest -m "not native_desktop"
#   native lane only:           python -m pytest -m native_desktop
#   quick inner loop:           python -m pytest -m "not slow and not native_desktop"
# Parallel (pytest-xdist, dev-requirements.txt): add `-n auto`. tests/conftest.py then keeps every
# native_desktop test on ONE worker, one at a time (--dist loadgroup). The access violation other
# test orders used to hit (a module fixture destroying the QApplication) is fixed by #514.
markers =
    native_desktop: shows real native windows or reads desktop state (foreground, hit tests) - run one at a time, never next to each other
    slow: slow by design (real child processes killed and relaunched); still part of every full run
